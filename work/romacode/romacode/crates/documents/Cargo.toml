[package]
name = "rc-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RomaCode built-in documents engine: Word, Excel, PowerPoint, PDF, charts, canvas design and Figma tools in pure Rust (vendored, builtin native)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# ZIP (OOXML containers) and PDF stream compression: flate2 over the pure-Rust
# miniz_oxide backend — no C, no system zlib, same posture as db/tunnel.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# PNG decode (embed images into PDFs) and encode (charts/canvas output).
png = "0.17"
# TrueType/OpenType parsing, glyph lookup and rasterization for chart/canvas
# text (CJK capable) and PDF font embedding metrics. Pure Rust.
ab_glyph = "0.2"
# Figma REST client: rustls-based TLS (pure Rust), same as the server's stack.
ureq = { version = "2", features = ["json"], default-features = true }
