[package]
name = "mandroid"
version = "0.1.0"
edition = "2021"
description = "MANDROID — native Android engine: APK/AXML/DEX analysis + ADB wire protocol. No adb, aapt, apktool or jadx; no MCP server."
license = "MIT"

[lib]
name = "mandroid"
path = "src/lib.rs"

[[bin]]
name = "mandroid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
rsa = { version = "0.9", features = ["sha1", "sha2", "pem"] }
hex = "0.4"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
num-bigint-dig = "0.8"
rand = "0.8"
libc = "0.2"
png = "0.17"

[dev-dependencies]
tempfile = "3"
