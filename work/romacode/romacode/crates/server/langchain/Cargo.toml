[package]
name = "langchain-rust"
version = "0.1.0"
edition = "2021"
description = "LangChain rebuilt in pure Rust: LCEL runnables, prompts, chains, tool-calling agents, memory and RAG — with a built-in REPL agent CLI."
license = "MIT"
readme = "README.md"

[lib]
name = "langchain_rust"
path = "src/lib.rs"

[[bin]]
name = "langchain-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
