{% extends "admin/base.html" %}
{% block title %}Log in | {{ site_title }}{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="{{ admin_prefix }}/login/">
  {% csrf_token %}
  <p><label for="id_username">Username</label>
     <input type="text" name="username" id="id_username" class="form-control" autofocus></p>
  <p><label for="id_password">Password</label>
     <input type="password" name="password" id="id_password" class="form-control"></p>
  <button type="submit" class="btn">Log in</button>
</form>
{% endblock %}
