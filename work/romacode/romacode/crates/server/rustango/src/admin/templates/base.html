<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<style>
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#0e1726;color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
header a{color:#9fc3ff;text-decoration:none;margin-left:16px}
main{max-width:960px;margin:32px auto;padding:0 16px}
h1{font-size:22px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th,td{padding:10px 14px;border-bottom:1px solid #eceff3;text-align:left;font-size:14px}
th{background:#fafbfd;font-weight:600}
a{color:#0b5cc4;text-decoration:none}
a:hover{text-decoration:underline}
.btn{display:inline-block;background:#0b5cc4;color:#fff;padding:7px 14px;border-radius:6px;font-size:14px;border:none;cursor:pointer}
.btn.danger{background:#c0392b}
.btn.secondary{background:#6b7280}
.error{background:#fdecea;color:#b3261e;padding:10px 14px;border-radius:6px;margin-bottom:16px}
.messages li{list-style:none;background:#e8f5e9;color:#1b5e20;padding:10px 14px;border-radius:6px;margin-bottom:8px}
label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd2dc;border-radius:6px;font-size:14px;box-sizing:border-box}
.is-invalid{border-color:#c0392b}
.errorlist{color:#b3261e;font-size:13px;margin:4px 0;padding-left:18px}
.pagination{margin:14px 0}
.small{font-size:12px;color:#6b7280}
form.inline{display:inline}
</style>
</head>
<body>
<header>
  <strong>{{ site_header }}</strong>
  <nav>
    {% if user.is_authenticated %}<span>{{ user.username }}</span> <a href="{{ admin_prefix }}/logout/">Log out</a>{% endif %}
  </nav>
</header>
<main>
{% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.level_tag }}">{{ m.message }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
